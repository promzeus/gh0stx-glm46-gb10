# GLM-4.6 NVFP4A16 GPTQ calibrated re-quant, single-GPU streaming (one process, all 92 layers).
# W4A16 RTN (no calib) degenerated into reasoning loops -> weight-quant defect. This fixes the
# rounding with per-layer GPTQ (Hessian error-compensation) on a reasoning-flavored calib,
# NVFP4A16 (weights FP4, activations bf16). Disk holds everything (pruned 282GB + out 82GB on
# 800Gi root), so no streaming/presigned orchestration: sync in, quant, finalize, sync out.
# Output -> glm46-nvfp4-gptq (NEW prefix; leaves glm46-nvfp4a16 / glm46-nvfp4 untouched for
# comparison). Coherence tested on gx10 (sm_121a) after transfer, not here.
apiVersion: batch/v1
kind: Job
metadata:
  name: glm-stream
  namespace: ${K8S_NS}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: glm-stream }
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: ${K8S_SA}
      nodeSelector:
        workload: glm-stream
      tolerations:
        - { key: nvidia.com/gpu, effect: NoSchedule, operator: Exists }
        - { key: karpenter.sh/disruption, effect: NoSchedule, operator: Exists }
      containers:
        - name: quant
          image: vllm/vllm-openai:latest
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -uo pipefail
              B=${S3_BUCKET_NAME}
              export AWS_REGION=${AWS_REGION} HF_HOME=/data/.hf TMPDIR=/data/tmp \
                     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              mkdir -p /data/pruned /data/ref /data/out /data/scripts /data/tmp /data/.hf
              cd /data/scripts
              # Two separate pip passes: resolving llmcompressor==0.14.0 and
              # transformers==5.12.1 together is ResolutionImpossible. Install
              # llmcompressor + its deps first (pulls compressed-tensors, tokenizers,
              # hub), then pin transformers==5.12.1 in a second pass (the box runs
              # both together; a separate invocation warns about the pin, not errors).
              echo "[job] deps $(date -u)"
              python3 -m pip install -q -U \
                llmcompressor==0.14.0 accelerate datasets safetensors huggingface_hub hf_xet \
                sentencepiece tiktoken blobfile awscli 2>&1 | tail -3 || true
              python3 -m pip install -q -U transformers==5.12.1 2>&1 | tail -2 || true
              python3 - <<'PY' || { echo "[job] FATAL: import check failed"; exit 1; }
              import transformers, llmcompressor, compressed_tensors
              from transformers.models.glm4_moe.modeling_glm4_moe import Glm4MoeDecoderLayer, Glm4MoeRotaryEmbedding
              from compressed_tensors.compressors import compress_module
              print("[job] imports ok: transformers", transformers.__version__,
                    "llmcompressor", llmcompressor.__version__)
              PY
              command -v aws >/dev/null || { echo "[job] FATAL: aws not on PATH after pip"; exit 1; }
              if aws s3 ls s3://$B/glm46-nvfp4-gptq/_COMPLETE >/dev/null 2>&1; then
                echo "[job] === RESUME: glm46-nvfp4-gptq/_COMPLETE already in S3, nothing to do ==="
                echo "[job] === GLM_STREAM_DONE $(date -u) ==="; sleep 20; exit 0
              fi
              echo "[job] fetch scripts $(date -u)"
              for f in glm_stream_gptq.py glm_calib_gen.py finalize_job.py; do
                aws s3 cp s3://$B/glm46/$f ./$f || { echo "[job] FATAL: cannot fetch $f"; exit 1; }
              done
              echo "[job] pull pruned bf16 (282GB) $(date -u)"
              aws s3 sync s3://$B/glm46-pruned/ /data/pruned/ --no-progress 2>&1 | tail -1
              test -f /data/pruned/config.json || { echo "[job] FATAL: pruned config.json missing"; exit 1; }
              test -f /data/pruned/model.safetensors.index.json || { echo "[job] FATAL: pruned index missing"; exit 1; }
              echo "[job] pull ref config/tokenizer (no weights) $(date -u)"
              aws s3 sync s3://$B/glm46-nvfp4a16/ /data/ref/ --no-progress \
                --exclude "*.safetensors" --exclude "*.index.json" 2>&1 | tail -1
              test -f /data/ref/config.json || { echo "[job] FATAL: ref config.json missing"; exit 1; }
              nvidia-smi -L 2>&1 | head -1 || true
              echo "[job] === GEN CALIB (32 reasoning rows, seq 1536) $(date -u) ==="
              CALIB_MODEL=/data/pruned CALIB_OUT=/data/calib.jsonl CALIB_N=32 CALIB_SEQ=1536 \
                python3 glm_calib_gen.py; grc=$?
              test -s /data/calib.jsonl || { echo "[job] FATAL: empty calib.jsonl (rc=$grc)"; exit 1; }
              echo "[job] === STREAM GPTQ NVFP4A16, all 92 layers, one process $(date -u) ==="
              STREAM_IN=/data/pruned STREAM_OUT=/data/out CALIB_JSONL=/data/calib.jsonl \
                CALIB_N=32 CALIB_SEQ=1536 LAYERS="" \
                python3 glm_stream_gptq.py; qrc=$?
              if [ $qrc -ne 0 ]; then echo "[job] QUANT_FAILED rc=$qrc"; sleep 10; exit $qrc; fi
              nlayer=$(ls /data/out/model-layer-*.safetensors 2>/dev/null | wc -l)
              echo "[job] per-layer files: $nlayer (expect 92)"
              [ "$nlayer" -eq 92 ] || { echo "[job] FATAL: expected 92 layer files, got $nlayer"; exit 1; }
              echo "[job] === FINALIZE (nonlayer + index + config) $(date -u) ==="
              STREAM_IN=/data/pruned STREAM_OUT=/data/out REF_DIR=/data/ref \
                python3 finalize_job.py; frc=$?
              if [ $frc -ne 0 ]; then echo "[job] FINALIZE_FAILED rc=$frc"; sleep 10; exit $frc; fi
              test -f /data/out/model.safetensors.index.json || { echo "[job] FATAL: no index after finalize"; exit 1; }
              test -f /data/out/config.json || { echo "[job] FATAL: no config after finalize"; exit 1; }
              echo "[job] output size:"; du -sh /data/out
              echo "[job] === PUSH glm46-nvfp4-gptq -> S3 $(date -u) ==="
              aws s3 sync /data/out s3://$B/glm46-nvfp4-gptq/ --no-progress 2>&1 | tail -2
              echo ok | aws s3 cp - s3://$B/glm46-nvfp4-gptq/_COMPLETE
              echo "[job] === GLM_STREAM_DONE $(date -u) ==="
          env:
            - { name: AWS_REGION, value: "${AWS_REGION}" }
            - { name: HF_HOME, value: "/data/.hf" }
            - { name: TMPDIR, value: "/data/tmp" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
          resources:
            requests: { cpu: "3", memory: 12Gi, nvidia.com/gpu: 1 }
            limits: { nvidia.com/gpu: 1 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 750Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }

# Weight-only NVFP4 (W4A16) quant of GLM-4.6 pruned, CPU-only, no calibration.
# Tests whether 4-bit ACTIVATIONS (A4) caused the reasoning degeneration: this
# keeps activations bf16, weights NVFP4. Output -> glm46-nvfp4a16 (new prefix).
apiVersion: batch/v1
kind: Job
metadata:
  name: glm-cpuquant
  namespace: ${K8S_NS}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: { app: glm-cpuquant }
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: ${K8S_SA}
      nodeSelector:
        workload: glm-cpuquant
      tolerations:
        - { key: karpenter.sh/disruption, effect: NoSchedule, operator: Exists }
      containers:
        - name: cpuquant
          image: vllm/vllm-openai:latest
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -uo pipefail
              B=${S3_BUCKET_NAME}
              echo "[job] deps $(date -u)"
              python3 -m pip install -q -U llmcompressor==0.14.0 accelerate safetensors huggingface_hub hf_xet sentencepiece tiktoken blobfile awscli 2>&1 | tail -2 || true
              python3 -m pip install -q -U transformers 2>&1 | tail -1 || true
              export HF_HOME=/data/.hf TMPDIR=/data/tmp
              mkdir -p /data/pruned /data/nvfp4a16 /data/scripts /data/tmp /data/.hf && cd /data/scripts
              aws s3 cp s3://$B/glm46/cpu_wonly_nvfp4.py ./cpu_wonly_nvfp4.py
              if aws s3 ls s3://$B/glm46-nvfp4a16/_COMPLETE >/dev/null 2>&1; then
                echo "[job] === RESUME: glm46-nvfp4a16 already in S3 ==="; echo "[job] === CPUQUANT_DONE $(date -u) ==="; sleep 30; exit 0
              fi
              echo "[job] pull glm46-pruned $(date -u)"
              aws s3 sync s3://$B/glm46-pruned/ /data/pruned/ --no-progress 2>&1 | tail -1
              test -f /data/pruned/config.json || { echo "[job] FATAL: pruned config.json missing"; exit 1; }
              echo "[job] === CPU WEIGHT-ONLY NVFP4 (W4A16) $(date -u) ==="
              WONLY_IN=/data/pruned WONLY_OUT=/data/nvfp4a16 python3 cpu_wonly_nvfp4.py; rc=$?
              if [ $rc -ne 0 ]; then echo "[job] CPUQUANT_FAILED rc=$rc"; sleep 5; exit $rc; fi
              echo "[job] output size:"; du -sh /data/nvfp4a16
              echo "[job] === PUSH glm46-nvfp4a16 -> S3 $(date -u) ==="
              aws s3 sync /data/nvfp4a16 s3://$B/glm46-nvfp4a16/ --no-progress 2>&1 | tail -2
              echo ok | aws s3 cp - s3://$B/glm46-nvfp4a16/_COMPLETE
              echo "[job] === CPUQUANT_DONE $(date -u) ==="
          env:
            - { name: AWS_REGION, value: "${AWS_REGION}" }
            - { name: HF_HOME, value: "/data/.hf" }
            - { name: TMPDIR, value: "/data/tmp" }
            - { name: OMP_NUM_THREADS, value: "44" }
          resources:
            requests: { cpu: "40", memory: 340Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 560Gi }

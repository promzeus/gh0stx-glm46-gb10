# Full-model GPTQ re-quant of pruned GLM-4.6 (the correct MoE path).
# Knobs (env below): NVFP4_RECIPE uniform -> glm46-nvfp4-gptq-full (NVFP4A16 on every Linear, the
# 87.3 GB checkpoint on gx10); mixed -> glm46-nvfp4-mixed (experts NVFP4A16, attention/shared/dense FP8,
# ~94 GB). CALIB_SOURCE offline (bundled seeds, no <think>) or reasoning (public <think> traces through
# the GLM chat template), see glm_calib_gen.py.
# The bare-layer streaming hack left routed experts uncalibrated (weight_global_scale
# stuck at 1.0 -> dead experts -> `!`). nvfp4_quant.py uses llm-compressor's full
# pipeline: load_quantizable_moe linearizes experts, moe_calibrate_all_experts routes
# every token to every expert, the sequential pipeline computes real qparams, and
# save_compressed writes vLLM-native per-expert keys. Needs the 282GB bf16 CPU-resident
# (per-block GPU onload), hence the 900Gi node. Output -> glm46-nvfp4-gptq-full (fresh
# prefix; the broken glm46-nvfp4-gptq is left untouched). Verifies an expert's
# weight_global_scale != 1.0 before the S3 push.
apiVersion: batch/v1
kind: Job
metadata:
  name: glm-requant-full
  namespace: ${K8S_NS}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels: { app: glm-requant-full }
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: ${K8S_SA}
      nodeSelector:
        workload: glm-requant
      tolerations:
        - { key: nvidia.com/gpu, effect: NoSchedule, operator: Exists }
        - { key: karpenter.sh/disruption, effect: NoSchedule, operator: Exists }
      containers:
        - name: requant
          image: vllm/vllm-openai:latest
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -uo pipefail
              B=${S3_BUCKET_NAME}
              RECIPE="${NVFP4_RECIPE:-uniform}"; CALIB="${CALIB_SOURCE:-offline}"
              case "$RECIPE" in
                uniform) OUT_PREFIX=glm46-nvfp4-gptq-full ;;
                mixed)   OUT_PREFIX=glm46-nvfp4-mixed ;;
                *) echo "[job] FATAL: NVFP4_RECIPE=$RECIPE"; exit 1 ;;
              esac
              echo "[job] recipe=$RECIPE calib=$CALIB out=$OUT_PREFIX"
              export AWS_REGION=${AWS_REGION} HF_HOME=/data/.hf TMPDIR=/data/tmp \
                     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              mkdir -p /data/pruned /data/nvfp4 /data/scripts /data/tmp /data/.hf && cd /data/scripts
              echo "[job] deps $(date -u)"
              python3 -m pip install -q -U \
                llmcompressor==0.14.0 accelerate datasets safetensors huggingface_hub hf_xet \
                sentencepiece tiktoken blobfile awscli 2>&1 | tail -2 || true
              python3 -m pip install -q -U transformers==5.12.1 2>&1 | tail -1 || true
              command -v aws >/dev/null || { echo "[job] FATAL: aws missing"; exit 1; }
              if aws s3 ls s3://$B/$OUT_PREFIX/_COMPLETE >/dev/null 2>&1; then
                echo "[job] RESUME: $OUT_PREFIX already complete"; echo "[job] === DONE ==="; sleep 20; exit 0
              fi
              for f in nvfp4_quant.py glm_calib_gen.py; do
                aws s3 cp s3://$B/glm46/$f ./$f || { echo "[job] FATAL fetch $f"; exit 1; }
              done
              echo "[job] pull pruned bf16 (282GB) $(date -u)"
              aws s3 sync s3://$B/glm46-pruned/ /data/pruned/ --no-progress 2>&1 | tail -1
              test -f /data/pruned/config.json || { echo "[job] FATAL no pruned config"; exit 1; }
              nvidia-smi -L 2>&1 | head -1 || true
              echo "[job] === calib source=$CALIB (256 rows, seq 2048) $(date -u) ==="
              CALIB_MODEL=/data/pruned CALIB_OUT=/data/calib.jsonl CALIB_N=256 CALIB_SEQ=2048 CALIB_SOURCE=$CALIB \
                python3 glm_calib_gen.py
              test -s /data/calib.jsonl || { echo "[job] FATAL empty calib"; exit 1; }
              echo "[job] === FULL-MODEL GPTQ recipe=$RECIPE (moe_calibrate_all_experts) $(date -u) ==="
              NVFP4_IN=/data/pruned NVFP4_OUT=/data/nvfp4 NVFP4_SAMPLES=256 NVFP4_MAXSEQ=2048 \
                NVFP4_SCHEME=NVFP4A16 NVFP4_MODIFIER=gptq NVFP4_RECIPE=$RECIPE NVFP4_CALIB_JSONL=/data/calib.jsonl \
                python3 nvfp4_quant.py; qrc=$?
              if [ $qrc -ne 0 ]; then echo "[job] QUANT_FAILED rc=$qrc"; sleep 10; exit $qrc; fi
              echo "[job] === VERIFY expert global_scale != 1.0 $(date -u) ==="
              python3 - <<'PY'
              import glob, json, sys
              from safetensors import safe_open
              idx = "/data/nvfp4/model.safetensors.index.json"
              wm = json.load(open(idx))["weight_map"]
              files = sorted(set(v for k, v in wm.items()
                                 if ".experts." in k and k.endswith("weight_global_scale")))
              exp = one = 0; import os
              for sh in files[:4]:
                  with safe_open(os.path.join("/data/nvfp4", sh), framework="pt") as f:
                      for k in f.keys():
                          if ".experts." in k and k.endswith("weight_global_scale"):
                              exp += 1
                              if bool((f.get_tensor(k).float() == 1.0).any()): one += 1
              print(f"[job] expert global_scale sampled={exp} ==1.0={one}")
              sys.exit(0 if exp > 0 and one == 0 else 3)
              PY
              vrc=$?
              if [ $vrc -ne 0 ]; then echo "[job] VERIFY_FAILED: experts still uncalibrated (rc=$vrc), NOT pushing"; sleep 10; exit $vrc; fi
              echo "[job] output size:"; du -sh /data/nvfp4
              echo "[job] === PUSH $OUT_PREFIX $(date -u) ==="
              aws s3 sync /data/nvfp4 s3://$B/$OUT_PREFIX/ --no-progress 2>&1 | tail -2
              echo ok | aws s3 cp - s3://$B/$OUT_PREFIX/_COMPLETE
              echo "[job] === DONE $(date -u) ==="
          env:
            - { name: AWS_REGION, value: "${AWS_REGION}" }
            - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
            - { name: NVFP4_RECIPE, value: "uniform" }     # uniform | mixed
            - { name: CALIB_SOURCE, value: "offline" }     # offline | reasoning
          resources:
            requests: { cpu: "60", memory: 450Gi, nvidia.com/gpu: 1 }
            limits: { nvidia.com/gpu: 1 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 780Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
